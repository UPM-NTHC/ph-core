<style>

   classes or generated/presentation attributes. */
table:not([class]):not([style]):not([border]):not([data-fhir]) {
  border-collapse: collapse;
  margin: 1em 0;
}

table:not([class]):not([style]):not([border]):not([data-fhir]) th,
table:not([class]):not([style]):not([border]):not([data-fhir]) td {
  border: 1px solid #e2e8f0;
  padding: 8px 14px;
  vertical-align: top;
}

.ph-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
</style>
